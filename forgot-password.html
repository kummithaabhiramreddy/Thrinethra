<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — THRINETHRA</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-900:#0A0E13; --card-bg:#161B22; --card-bg-2:#1B2129;
    --line:#242E38; --text-hi:#F3F1EC; --text-mid:#9AA7B4; --text-low:#6B7684; --alert:#FF7A45;
    --live:#34D399;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg-900); color:var(--text-hi); font-family:'Inter',sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:440px; margin:0 auto; padding:0 22px 60px; }
  .top-logo{ display:flex; align-items:center; gap:9px; padding:26px 0 6px; }
  .wordmark{ display:inline-flex; align-items:baseline; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.28rem; letter-spacing:0.01em; color:#fff; line-height:1; white-space:nowrap; }
  .wordmark .gate-i{ position:relative; display:inline-flex; align-items:flex-end; justify-content:center; width:0.46em; height:1em; margin:0 0.01em; transform:translateY(0.02em); }
  .wordmark .gate-frame{ position:absolute; left:0.03em; right:0.03em; top:0.02em; height:0.66em; border:0.09em solid var(--alert); border-bottom:none; border-radius:0.05em 0.05em 0 0; }
  .wordmark .gate-stem{ position:relative; width:0.09em; height:0.74em; background:#fff; border-radius:0.03em; z-index:2; }
  .wordmark .gate-star{ position:absolute; top:-0.2em; right:-0.14em; width:0.34em; height:0.34em; z-index:3; }

  .hero-h{ font-family:'Fraunces',serif; font-weight:500; font-size:2.1rem; line-height:1.2; text-align:center; margin:34px 0 10px; }
  .hero-sub{ text-align:center; color:var(--text-mid); font-size:0.92rem; margin-bottom:30px; }

  .card{ background:var(--card-bg); border:1px solid var(--line); border-radius:20px; padding:26px 22px; }
  .field-label{ font-size:0.82rem; color:var(--text-mid); margin-bottom:8px; display:block; }
  .email-input{ width:100%; padding:13px 16px; border-radius:12px; margin-bottom:16px; background:var(--card-bg-2); border:1px solid var(--line); color:var(--text-hi); font-size:0.92rem; font-family:'Inter',sans-serif; outline:none; }
  .email-input::placeholder{ color:var(--text-low); }
  .email-input:focus{ border-color:var(--alert); }
  .btn-white{ display:block; width:100%; text-align:center; padding:14px; border-radius:12px; background:#fff; color:#141414; font-weight:600; font-size:0.95rem; border:none; cursor:pointer; transition:background .2s; }
  .btn-white:hover{ background:#f0f0f0; }
  .confirm-msg{ display:none; text-align:center; font-size:0.88rem; color:var(--live); background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.3); border-radius:10px; padding:12px; }
  .confirm-msg.show{ display:block; }
  .switch-row{ text-align:center; font-size:0.86rem; color:var(--text-mid); margin-top:24px; }
  .switch-row a{ color:var(--alert); font-weight:600; }
  .switch-row a:hover{ text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-logo">
    <a class="wordmark" href="index.html">THR<span class="gate-i"><span class="gate-frame"></span><span class="gate-stem"></span><svg class="gate-star" viewBox="0 0 24 24" fill="none"><path d="M12 1V23M2.5 6.2L21.5 17.8M21.5 6.2L2.5 17.8" stroke="#FF7A45" stroke-width="2" stroke-linecap="round"/></svg></span>NETHRA</a>
  </div>

  <h1 class="hero-h">Reset your password</h1>
  <p class="hero-sub">We'll send a secure password reset link to your work email.</p>

  <div class="card">
    <form id="resetForm">
      <label class="field-label" for="resetEmail">Work email</label>
      <input class="email-input" type="email" id="resetEmail" placeholder="you@transportauthority.gov" required>
      <button class="btn-white" type="submit" id="resetBtn">Send reset link</button>
    </form>
    <div class="confirm-msg" id="confirmMsg">Check your inbox — if that email is registered, a password reset link has been dispatched.</div>
  </div>

  <div class="switch-row">Remembered it? <a href="login.html">Back to log in</a></div>
</div>

<script src="assets/js/auth.js"></script>
<script>
  document.getElementById('resetForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var email = document.getElementById('resetEmail').value;
    var btn = document.getElementById('resetBtn');
    var msg = document.getElementById('confirmMsg');
    btn.disabled = true; btn.style.opacity = '0.7'; btn.textContent = 'Sending…';

    try {
      await window.ThrinethraAuth.resetPassword(email);
      btn.style.display = 'none';
      msg.classList.add('show');
    } catch(err) {
      btn.disabled = false; btn.style.opacity = '1'; btn.textContent = 'Send reset link';
      alert(err.message || 'Failed to send reset link.');
    }
  });
</script>
</body>
</html>
